spring:
  application:
    name: "mts"
  flyway:
    locations: classpath:/db/migration
    schemas: public
    baselineOnMigrate: true
    enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/courses_app
    username: user
    password: user
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: localhost:29093

management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /admin
  endpoint:
    shutdown:
      access: none

  metrics:
    endpoints:
      web:
        exposure:
          include: health,info,prometheus
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        all: true
    tags:
      service: "user-service"

server:
  tomcat:
    threads:
      max: 50
      min-spare: 10
resilience4j:
  ratelimiter:
    instances:
      default:
        limit-for-period: 10
        limit-refresh-period: 1s
        timeout-duration: 100ms
  circuitbreaker:
    instances:
      apiCircuitBreaker:
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s

topic-to-send-message: mts-topic